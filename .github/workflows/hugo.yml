name: Déploiement Hugo vers GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Installer Hugo
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Récupérer le dépôt (avec les sous-modules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Configurer GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Construire le site
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Annonce par e-mail des pages ajoutées, une fois le site en ligne (Brevo).
  # Inactif tant que le secret BREVO_API_KEY et la variable BREVO_LISTE ne sont
  # pas définis dans le dépôt. Par défaut, crée une campagne en brouillon dans
  # Brevo (à relire et envoyer) ; variable BREVO_ENVOI = immediat pour un envoi
  # direct. Un échec ici ne touche pas au site, déjà déployé.
  annonce:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Annoncer les nouvelles pages
        env:
          AVANT: ${{ github.event.before }}
          APRES: ${{ github.sha }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LISTE: ${{ vars.BREVO_LISTE }}
          BREVO_ENVOI: ${{ vars.BREVO_ENVOI }}
        run: python3 .github/scripts/annonce_nouvelles_pages.py
