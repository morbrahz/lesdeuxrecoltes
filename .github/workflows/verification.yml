name: Vérification de la construction (pull requests)

# Construit le site sur chaque pull request, sans rien publier, et vérifie la
# page du Tableau d'exploitation. Le déploiement reste fait par hugo.yml, sur
# main uniquement.

on:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Installer Hugo
        run: |
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o /tmp/hugo.deb
          sudo dpkg -i /tmp/hugo.deb
      - name: Récupérer le dépôt (avec les sous-modules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Construire le site
        run: hugo --gc --minify -d /tmp/site
      - name: Vérifier la page du Tableau d'exploitation
        run: |
          verifier() { grep -q -- "$2" "/tmp/site/$1" || { echo "::error::$1 : « $2 » introuvable"; exit 1; }; }
          verifier tableau-exploitation/index.html "tableau-exploitation.html#demo"
          verifier tableau-exploitation/index.html 'download="\?tableau-exploitation-1'
          verifier tableau-exploitation/index.html "mailto:contact@lesdeuxrecoltes.fr?subject="
          verifier tableau-exploitation/index.html "après-lessai"
          verifier tableau-exploitation/index.html "outil-tableau-demo"
          verifier tableau-exploitation/index.html "telechargement-tableau-exploitation"
          verifier tableau-exploitation/index.html "contact-tableau-licence"
          verifier tableau-exploitation/tableau-exploitation.html "connect-src 'none'"
          verifier tableau-exploitation/tableau-exploitation.html 'name="robots" content="noindex'
          verifier tableau-exploitation/index.html '"@type":"SoftwareApplication"'
          verifier tableau-exploitation/index.html 'og:image'
          verifier tableau-exploitation/index.html "logiciel de suivi de l"
          test -f /tmp/site/tableau-exploitation/exemple-synthese.pdf
          test -f /tmp/site/images/tableau-exploitation/tableau-demo.jpg
          echo "Page du Tableau d'exploitation construite et vérifiée."
