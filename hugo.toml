baseURL = 'https://lesdeuxrecoltes.fr/'
# Langue du site. defaultContentLanguage fixe <html lang> et les libelles du
# theme (i18n/fr.yaml de PaperMod) ; languageCode seul ne suffit pas.
defaultContentLanguage = 'fr'
languageCode = 'fr-FR'
title = 'Les Deux Récoltes'
theme = 'PaperMod'

# Genere /robots.txt (tout autoriser + adresse du sitemap).
enableRobotsTXT = true

# Taxonomies desactivees : le site n'utilise ni tags ni categories.
# Sans cela, Hugo genere /tags/ et /categories/ vides, qui entrent dans le
# sitemap et diluent les quelques URL du site.
disableKinds = ['taxonomy', 'term']

[params]
  # Balise <title> de l'accueil (sinon le seul nom du site, sans mot-cle).
  homeTitle = 'Les Deux Récoltes – gestion, épargne et élevage laitier'
  env = 'production'
  # Utilisee comme meta description de la page d'accueil (les autres pages
  # utilisent leur propre champ summary).
  description = "Méthodes de gestion, d'investissement et d'élevage laitier écrites depuis une exploitation : trésorerie, épargne, placements, structures, traite robotisée."
  # Mesure d'audience GoatCounter : code du site (sous-domaine choisi a l'inscription).
  goatcounter = 'lesdeuxrecoltes'
  # Mesure d'audience Umami Cloud (region UE), en essai parallele a GoatCounter
  # jusqu'a la revue trimestrielle : identifiant du site (data-website-id).
  # Vide, aucun script Umami n'est charge.
  umamiWebsiteId = 'cfa94274-7910-4190-a2cd-032abc6cc27a'
  # Inscription aux nouvelles pages : adresse du formulaire Brevo
  # (https://....sibforms.com/serve/..., code « HTML simple » du formulaire).
  # Vide, le formulaire n'apparait nulle part (layouts/_partials/inscription.html).
  brevoFormulaire = 'https://affc8437.sibforms.com/serve/MUIFADXGhy7hEEWgPRZ2HulxKdeVL_jhaf7_RHf3dTGhlk1GF71VUfVtiJ53HmTYIh3OyrGoJBqyYjyBokwmrFoezbuW3UQ3FJh60HZnVtCX9Qt37X1q3XKto0K7pO0ZZCQ1d4uEQnjzsWIGVrQJoZGeabQIAkVDYiWF_kB9ksQD5SZ5aO-nyhaXimEKR8T_xyRd8oiz6H4YeSWRlQ=='
  # Google Search Console : code de la balise HTML, si verification par DNS impossible.
  googleSiteVerification = ''
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  ShowToc = false
  comments = false
  hidemeta = true

  # Vente du Tableau d'exploitation (version professionnelle, payante).
  # Tant qu'un champ obligatoire est vide, la construction du site ECHOUE sur les
  # pages de vente (layouts/_partials/vente-controle.html) : rien n'est publie
  # par erreur, le site en ligne reste le precedent.
  [params.vente]
    # Obligatoires : identite de l'entrepreneur individuel (micro-entreprise)
    nom = ''                       # Prenom et nom, tels qu'inscrits au registre
    siren = ''                     # 9 chiffres
    adresse = ''                   # adresse professionnelle (ou de domiciliation)
    # Obligatoires : prix annuels affiches (texte libre, ex. '120 €')
    prix_exploitant = ''           # 1 a 2 dossiers
    prix_conseiller = ''           # jusqu'a 25 dossiers
    # Facultatif : lien de paiement Stripe (Payment Link) de la formule Exploitant.
    # Vide, l'achat se fait par e-mail (facture puis virement).
    lien_paiement_exploitant = ''
    # Mention de TVA de la micro-entreprise en franchise en base
    tva = 'TVA non applicable, art. 293 B du CGI'
    # Version du tableau proposee au telechargement (static/tableau-exploitation/)
    version = '1.0.1'

  [params.homeInfoParams]
    Title = "Méthodes de gestion, d'investissement et d'élevage, écrites depuis une exploitation agricole"
    Content = "Ce qui est publié ici a d'abord été résolu pour un usage propre : trésorerie, épargne, placements, choix des structures et conduite d'un troupeau laitier trait au robot. Les pages sont permanentes — elles se corrigent et se complètent quand la pratique évolue.\n\n**[Tous les outils en ligne](/outils/)**, calcul dans votre navigateur : [EBE en cours d'année](/tresorerie/outil-ebe-en-cours-d-annee/) · [vaches à pousser au robot](/elevage/outil-vaches-a-pousser/) · [bilan du troupeau](/elevage/outil-bilan-troupeau/) · [renouvellement du troupeau](/elevage/outil-renouvellement/) · [quand arrêter d'inséminer](/elevage/outil-reinsemination/).\n\n**Conseillers, centres de gestion, cabinets** : le [Tableau d'exploitation](/tableau-exploitation/) est la version professionnelle de l'outil EBE (plusieurs dossiers, atterrissage, synthèse de rendez-vous, FEC). Essai gratuit de 30 jours.\n\nUne question, une remarque, une pratique différente sur votre exploitation ? Écrivez à [contact@lesdeuxrecoltes.fr](mailto:contact@lesdeuxrecoltes.fr) : chaque message est lu."

