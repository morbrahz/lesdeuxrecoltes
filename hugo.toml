baseURL = 'https://lesdeuxrecoltes.fr/'
languageCode = 'fr-fr'
title = 'Les Deux Récoltes'
theme = 'PaperMod'

# Taxonomies desactivees : le site n'utilise ni tags ni categories.
# Sans cela, Hugo genere /tags/ et /categories/ vides, qui entrent dans le
# sitemap et diluent les quelques URL du site.
disableKinds = ['taxonomy', 'term']

[params]
  env = 'production'
  # Utilisee comme meta description de la page d'accueil (les autres pages
  # utilisent leur propre champ summary).
  description = "Méthodes de gestion et d'investissement écrites depuis une exploitation agricole : trésorerie, épargne et placements."
  # Mesure d'audience GoatCounter : code du site (sous-domaine choisi a l'inscription).
  goatcounter = 'lesdeuxrecoltes'
  # Google Search Console : code de la balise HTML, si verification par DNS impossible.
  googleSiteVerification = ''
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  ShowToc = false
  comments = false
  hidemeta = true

  [params.homeInfoParams]
    Title = "Méthodes de gestion et d'investissement, écrites depuis une exploitation agricole"
    Content = "Ce qui est publié ici a d'abord été résolu pour un usage propre : trésorerie, épargne et placements. Les pages sont permanentes — elles se corrigent et se complètent quand la pratique évolue.\n\nUne erreur, une objection, une pratique différente sur votre exploitation ? Écrivez à [contact@lesdeuxrecoltes.fr](mailto:contact@lesdeuxrecoltes.fr). Les retours d'exploitants sont ce qui corrige le mieux une méthode."

[[menu.main]]
  name = 'Trésorerie'
  url = '/tresorerie/'
  weight = 10

[[menu.main]]
  name = 'Épargne'
  url = '/epargne/'
  weight = 15

[[menu.main]]
  name = 'À propos'
  url = '/a-propos/'
  weight = 20

[[menu.main]]
  name = 'Mentions légales'
  url = '/mentions-legales/'
  weight = 30

[[menu.main]]
  name = 'Confidentialité'
  url = '/confidentialite/'
  weight = 40
