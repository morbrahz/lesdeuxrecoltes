baseURL = 'https://lesdeuxrecoltes.fr/'
languageCode = 'fr-fr'
title = 'Les Deux Récoltes'
theme = 'PaperMod'

# Taxonomies desactivees : le site n'utilise ni tags ni categories.
# Sans cela, Hugo genere /tags/ et /categories/ vides, qui entrent dans le
# sitemap et diluent les quelques URL du site.
disableKinds = ['taxonomy', 'term']

[params]
  env = 'production'
  # Mesure d'audience GoatCounter : code du site (sous-domaine choisi a l'inscription).
  goatcounter = 'lesdeuxrecoltes'
  # Google Search Console : code de la balise HTML, si verification par DNS impossible.
  googleSiteVerification = ''
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = false
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = false
  ShowRssButtonInSectionTermList = false
  ShowToc = false
  comments = false
  hidemeta = true

  [params.homeInfoParams]
    Title = 'Les Deux Récoltes'
    Content = "Méthodes de gestion et d'investissement, écrites depuis une exploitation agricole.\n\nCe qui est publié ici a d'abord été résolu pour un usage propre : trésorerie, structures, épargne et placements. Les pages sont permanentes — elles se corrigent et se complètent quand la pratique évolue."

[[menu.main]]
  name = 'Trésorerie'
  url = '/tresorerie/'
  weight = 10

[[menu.main]]
  name = 'À propos'
  url = '/a-propos/'
  weight = 20

[[menu.main]]
  name = 'Mentions légales'
  url = '/mentions-legales/'
  weight = 30

[[menu.main]]
  name = 'Confidentialité'
  url = '/confidentialite/'
  weight = 40
